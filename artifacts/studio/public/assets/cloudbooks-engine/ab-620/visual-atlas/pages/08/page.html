<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=768">
<title>Nodo de respuestas generativas</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  @page{size:768px 1152px;margin:0}
  body{background:#dfe4ec;display:flex;justify-content:center;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
  /* Página ACOTADA al tamaño de hoja (2:3) → no crece infinita; la imagen encaja sin recorte. */
  .page{width:768px;height:1152px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:34px;flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:0 18px 0 16px;background:#061B49;color:#fff;font-size:13px;letter-spacing:.01em}
  .topbar .badge{display:inline-flex;align-items:center;height:21px;padding:0 9px;border-radius:6px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;flex:0 0 auto;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .topbar .dom{font-weight:600;opacity:.95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Saturación -15% (determinista, sin regenerar la imagen). */
  .infographic{flex:1 1 auto;width:100%;min-height:0;object-fit:contain;background:#fff;display:block;filter:saturate(0.85)}
  .footer{height:34px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;background:#061B49;color:#fff;font-size:14px;letter-spacing:.04em;font-weight:750}
  .footer .brand{justify-self:start;font-weight:800;letter-spacing:.01em}
  .footer .series{justify-self:center;opacity:.94;font-weight:600}
  .footer .pg{justify-self:end;opacity:.82;font-variant-numeric:tabular-nums}
</style></head>
<body><div class="page">
  <div class="topbar"><span class="badge">AI-200</span><span class="dom">Ruta 1 — Diseñar conversaciones y respuestas con topics en Copilot Studio</span></div>
  <img class="infographic" src="/assets/cloudbooks-engine/ab-620/visual-atlas/pages/08/infographic.png" alt="Diagrama de Nodo de respuestas generativas">
  <div class="footer"><span class="brand">CloudBooks</span><span class="series">Visual Atlas</span><span class="pg">08/42</span></div>
</div></body></html>
