<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=768">
<title>Tags y versiones de imágenes</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#dfe4ec;display:flex;justify-content:center;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
  .page{width:768px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:34px;display:flex;align-items:center;gap:11px;padding:0 18px 0 16px;background:#061B49;color:#fff;font-size:13px;letter-spacing:.01em}
  .topbar .badge{display:inline-flex;align-items:center;height:21px;padding:0 9px;border-radius:6px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;flex:0 0 auto;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .topbar .dom{font-weight:600;opacity:.95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Saturación -15% (determinista, sin regenerar la imagen). */
  .infographic{width:100%;display:block;filter:saturate(0.85)}
  .footer{height:34px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;background:#061B49;color:#fff;font-size:14px;letter-spacing:.04em;font-weight:750}
  .footer .brand{justify-self:start;font-weight:800;letter-spacing:.01em}
  .footer .series{justify-self:center;opacity:.94;font-weight:600}
  .footer .pg{justify-self:end;opacity:.82;font-variant-numeric:tabular-nums}
</style></head>
<body><div class="page">
  <div class="topbar"><span class="badge">AI-200</span><span class="dom">Ruta 1 — Alojamiento de aplicaciones en contenedores</span></div>
  <img class="infographic" src="/assets/cloudbooks-engine/ai-200/visual-atlas/pages/03/infographic.png" alt="Diagrama de Tags y versiones de imágenes">
  <div class="footer"><span class="brand">CloudBooks</span><span class="series">Visual Atlas</span><span class="pg">03/98</span></div>
</div></body></html>
